clusterRoles:
  cluster-admin:
    create: false
    createClusterRoleBinding: true
    clusterRoleBindingName: hmcts-cluster-admins
    bindingSubjects:
      clusterAdminGroup:
        apiGroup: rbac.authorization.k8s.io
        kind: Group
      jenkinsAdmin:
        kind: ServiceAccount
        name: jenkins-admin
        namespace: kube-system
      adoAgent:
        kind: ServiceAccount
        name: ado-agent
        namespace: ado-agent
  contributor-role:
    create: true
    createBinding: false
    rules:
    - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
      resources: ["*"]
      verbs: ["*"]
  namespace-readonly-role:
    create: true
    createBinding: false
    createClusterRoleBinding: true
    clusterRoleBindingName: hmcts-cluster-namespace-readonly
    bindingSubjects:
      readerGroupID:
        apiGroup: rbac.authorization.k8s.io
        kind: Group
      contributorGroupID:
        apiGroup: rbac.authorization.k8s.io
        kind: Group
    rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list"]
  reader-role:
    create: true
    createBinding: false
    rules:
    - apiGroups: ["", "apps", "batch"]
      resources: ["*"]
      verbs: ["get","list","watch"]
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["*"]
  # Restricted variants of contributor-role / reader-role: no secrets, pods/exec, pods/attach
  # or workload creation. Unbound here; only take effect where a namespace RoleBinding references them.
  contributor-role-restricted:
    create: true
    createBinding: false
    rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch", "delete"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["get", "create"]
    - apiGroups: [""]
      resources: ["services", "endpoints", "events", "configmaps", "persistentvolumeclaims", "replicationcontrollers", "serviceaccounts", "resourcequotas", "limitranges"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments/scale", "statefulsets/scale"]
      verbs: ["get", "update", "patch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "delete"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]
      verbs: ["get", "list", "watch"]
  reader-role-restricted:
    create: true
    createBinding: false
    rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps", "persistentvolumeclaims", "replicationcontrollers", "serviceaccounts"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["get", "create"]
    - apiGroups: ["apps", "batch"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]
  jenkins-deploy:
    create: true
    rules:
    - apiGroups: ["", "policy", "batch", "extensions", "apps", "networking.istio.io", "networking.k8s.io", "security.istio.io", "rbac.authorization.k8s.io", "autoscaling", "cert-manager.io"]
      resources: ["*"]
      verbs: ["*"]
clusterServiceAccounts:
  jenkins-admin:
    namespace: kube-system
  jenkins-deploy:
    namespace: kube-system
